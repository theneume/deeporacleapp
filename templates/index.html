<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle Psychology Coach</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="chat-container">
        <header>
            <h1>Oracle</h1>
            <p class="subtitle">Your AI Psychology Coach</p>
        </header>

        <div id="chat-messages" class="chat-messages">
            </div>

        <div id="paywall" class="paywall-overlay" style="display: none;">
            <div class="paywall-content">
                <h2>Continue Your Journey</h2>
                <p>You've reached the limit of your complimentary exploration. To continue this deep dive into your authentic self, please choose an option below.</p>
                <button id="pay-button" class="primary-btn">Continue Session - $2.95</button>
                <p class="secure-text">🔒 Secure payment via Stripe</p>
            </div>
        </div>

        <div class="input-container">
            <div id="discovery-profile" class="form-section" style="display: none;">
                <h3>Your Self-Discovery Profile</h3>
                <div class="form-group">
                    <label for="personality">1. Describe your personality</label>
                    <textarea id="personality" placeholder="What makes you unique?"></textarea>
                </div>
                <div class="form-group">
                    <label for="goals">2. What are your goals and aspirations?</label>
                    <textarea id="goals" placeholder="What do you hope to achieve?"></textarea>
                </div>
                <button onclick="toggleProfile()" class="secondary-btn">Close Profile</button>
            </div>

            <textarea id="user-input" placeholder="Share your thoughts..."></textarea>
            <button id="send-btn">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const paywall = document.getElementById('paywall');
        const payButton = document.getElementById('pay-button');

        function toggleProfile() {
            const profile = document.getElementById('discovery-profile');
            profile.style.display = profile.style.display === 'none' ? 'block' : 'none';
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage('user', message);
            userInput.value = '';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message,
                        profile: {
                            personality: document.getElementById('personality')?.value,
                            goals: document.getElementById('goals')?.value
                        }
                    })
                });

                // FIX: Check Content-Type to avoid "Unexpected token '<'"
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.includes("application/json")) {
                    const data = await response.json();
                    if (data.show_paywall) {
                        paywall.style.display = 'flex';
                    } else if (data.response) {
                        appendMessage('oracle', data.response);
                    } else {
                        throw new Error(data.error || "Unknown error");
                    }
                } else {
                    throw new Error("Server returned HTML (likely a 404 or 500 error). Check backend logs.");
                }
            } catch (error) {
                console.error('Chat Error:', error);
                appendMessage('oracle', "I encountered a connection issue. Please refresh.");
            }
        }

        payButton.onclick = async () => {
            payButton.innerText = 'Processing...';
            payButton.disabled = true;
            try {
                const response = await fetch('/create-checkout-session', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.includes("application/json")) {
                    const data = await response.json();
                    if (data.url) {
                        window.location.href = data.url;
                    } else {
                        throw new Error(data.error || "Payment system error");
                    }
                } else {
                    throw new Error("Payment server returned an invalid response.");
                }
            } catch (error) {
                alert(`Payment error: ${error.message}`);
                payButton.innerText = 'Continue Session - $2.95';
                payButton.disabled = false;
            }
        };

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}-message`;
            div.innerHTML = role === 'oracle' ? marked.parse(text) : text;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        sendBtn.onclick = sendMessage;
        userInput.onkeypress = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } };
    </script>
</body>
</html>
