<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle Psychology Coach</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="chat-container">
        <header>
            <h1>Oracle</h1>
            <p class="subtitle">Your AI Psychology Coach</p>
        </header>

        <div id="chat-messages" class="chat-messages"></div>

        <div id="paywall" class="paywall-overlay" style="display: none;">
            <div class="paywall-content">
                <h2>Continue Your Journey</h2>
                <p>You've reached the limit of your complimentary exploration.</p>
                <button id="pay-button" class="primary-btn">Continue Session - $2.95</button>
            </div>
        </div>

        <div class="form-section">
            <h3>Your Self-Discovery Profile</h3>
            <div class="form-group">
                <label for="personality">1. Describe your personality</label>
                <textarea id="personality" placeholder="What makes you unique?"></textarea>
            </div>
            <div class="form-group">
                <label for="goals">2. What are your goals and aspirations?</label>
                <textarea id="goals" placeholder="What do you hope to achieve?"></textarea>
            </div>
            <div class="form-group">
                <label for="challenges">3. What are your challenges and obstacles?</label>
                <textarea id="challenges" placeholder="What stands in your way?"></textarea>
            </div>
            <div class="form-group">
                <label for="environment">4. How is your environment supporting you?</label>
                <textarea id="environment" placeholder="How is your life helping your goals?"></textarea>
            </div>
        </div>

        <div class="input-container">
            <textarea id="user-input" placeholder="Share your thoughts..."></textarea>
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        // ... (Original Message Display Logic) ...

        async function sendMessage() {
            const message = document.getElementById('user-input').value;
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                // STRIPE FIX: Check if response is valid JSON before parsing [cite: 123]
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.includes("application/json")) {
                    const data = await response.json();
                    if (data.show_paywall) {
                        document.getElementById('paywall').style.display = 'flex';
                    } else {
                        // Display message
                    }
                } else {
                    console.error("Server returned HTML error page instead of JSON.");
                }
            } catch (e) { console.error(e); }
        }

        document.getElementById('pay-button').onclick = async () => {
            const response = await fetch('/create-checkout-session', { method: 'POST' });
            const contentType = response.headers.get("content-type");
            
            if (contentType && contentType.includes("application/json")) {
                const data = await response.json();
                if (data.url) window.location.href = data.url;
            } else {
                alert("Payment system error. Please check server logs.");
            }
        };
    </script>
</body>
</html>
